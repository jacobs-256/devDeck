name: Marketplace release

on:
  push:
    tags:
      - 'marketplace-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update'
        required: true
        default: marketplace

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: pnpm --filter @devdeck/plugin-sdk build

      - name: Build marketplace plugins
        run: pnpm -C marketplace build

      - name: Require the marketplace signing key
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: |
          if [[ -z "${MARKETPLACE_SIGNING_KEY}" ]]; then
            echo "::error::Set the MARKETPLACE_SIGNING_KEY repository secret (Base64 Ed25519 seed)."
            exit 1
          fi

      - name: Pack and sign packages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MARKETPLACE_TAG: ${{ inputs.tag || github.ref_name }}
          DEVDECK_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: node marketplace/scripts/pack-release.mjs

      - name: Sign the registry and verify every artifact
        env:
          DEVDECK_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: |
          node marketplace/scripts/sign.mjs sign marketplace/release-dist/registry.json
          PUB="$(node marketplace/scripts/sign.mjs public-key)"
          printf '%s\n' "${PUB}" > marketplace/release-dist/public-key.txt
          echo "MARKETPLACE_PUBLIC_KEY=${PUB}" >> "${GITHUB_ENV}"
          for zip in marketplace/release-dist/*.zip; do
            node marketplace/scripts/sign.mjs verify "${zip}" "${zip}.sig" --pubkey "${PUB}"
          done
          node marketplace/scripts/sign.mjs verify \
            marketplace/release-dist/registry.json \
            marketplace/release-dist/registry.json.sig \
            --pubkey "${PUB}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Marketplace ${{ inputs.tag || github.ref_name }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Signed marketplace artifacts.

            - Registry: `https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/registry.json`
            - Registry signature: `registry.json.sig`
            - Public key (Base64 Ed25519): `${{ env.MARKETPLACE_PUBLIC_KEY }}`

            Add the registry URL in **Marketplace → Add registry**, paste the public key
            under **Trust options**, and enable signature verification.
          files: |
            marketplace/release-dist/registry.json
            marketplace/release-dist/registry.json.sig
            marketplace/release-dist/public-key.txt
            marketplace/release-dist/*.zip
            marketplace/release-dist/*.zip.sig

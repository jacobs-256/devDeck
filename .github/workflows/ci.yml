name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint Modules
        run: pnpm lint:modules

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Marketplace Typecheck
        run: pnpm -C marketplace typecheck

      - name: Marketplace Build
        run: pnpm -C marketplace build

      - name: Desktop tool tests
        run: pnpm --filter @devtoolbox/desktop test

      - name: Legacy Electron build (frozen reference)
        run: pnpm legacy:build

      - name: Scaffold template builds
        run: |
          node marketplace/scripts/create.mjs --id market-ci-template --name "CI Template"
          pnpm install --filter @devtoolbox/plugin-market-ci-template
          pnpm --filter @devtoolbox/plugin-market-ci-template build
          rm -rf marketplace/modules/market-ci-template

  rust:
    name: Rust policy crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p devtoolbox-contract -p devtoolbox-capability -p devtoolbox-market --all-targets -- -D warnings

      - name: Test
        run: cargo test -p devtoolbox-contract -p devtoolbox-capability -p devtoolbox-market

  tauri:
    name: Tauri host check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check host crate
        run: cargo check -p devtoolbox-desktop

      - name: Test host crate
        run: cargo test -p devtoolbox-desktop

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Marketplace acceptance (signed artifacts)
        run: ./scripts/marketplace-acceptance.sh market-emoji-search

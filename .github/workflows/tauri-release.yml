name: Tauri Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build ${{ matrix.label }}
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--bundles app,dmg --target aarch64-apple-darwin'
          - label: Windows x64
            os: windows-latest
            target: ''
            args: '--bundles nsis'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "extra=--config src-tauri/tauri.release.conf.json" >> "${GITHUB_OUTPUT}"
            echo "Updater signing enabled."
          else
            echo "extra=" >> "${GITHUB_OUTPUT}"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured; building without updater artifacts."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${MAC_CERT_P12_BASE64}" || -z "${MAC_CERT_PASSWORD}" || -z "${MAC_KEYCHAIN_PASSWORD}" ]]; then
            echo "::error::Missing macOS signing secrets (MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_KEYCHAIN_PASSWORD)."
            exit 1
          fi
          CERT_PATH="${RUNNER_TEMP}/devdeck.p12"
          printf '%s' "${MAC_CERT_P12_BASE64}" | base64 -D > "${CERT_PATH}"
          security create-keychain -p "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "${CERT_PATH}" -k build.keychain -P "${MAC_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)".*/\1/p' | grep 'Developer ID Application' | head -1)"
          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::No valid Developer ID signing identity was imported."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo "Imported signing identity: ${IDENTITY}"
          rm -f "${CERT_PATH}"

      - name: Configure Apple notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_API_ISSUER}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_KEY_P8_BASE64}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Missing Apple notarization secrets (APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY_P8_BASE64, APPLE_TEAM_ID)."
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          {
            echo "APPLE_API_KEY=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "${GITHUB_ENV}"
          echo "Notarization API key configured."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: DevDeck ${{ inputs.tag || github.ref_name }}
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extra }}

name: Tauri Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build ${{ matrix.label }}
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--bundles app,dmg --target aarch64-apple-darwin'
          - label: Windows x64
            os: windows-latest
            target: ''
            args: '--bundles nsis'
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release tag exists
        if: matrix.label == 'macOS arm64'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
            exit 0
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "::error::Workflow was triggered by tag ${RELEASE_TAG}, but the tag is not on origin."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "Created and pushed tag ${RELEASE_TAG}."

      - name: Resolve updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "extra=--config src-tauri/tauri.release.conf.json" >> "${GITHUB_OUTPUT}"
            echo "Updater signing enabled."
          else
            echo "extra=" >> "${GITHUB_OUTPUT}"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured; building without updater artifacts."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Tauri NSIS toolchain
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-${{ runner.os }}-${{ runner.arch }}-nsis3.13-utils0.5.3

      - name: Pre-seed Tauri NSIS toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # Pinned to crates/tauri-bundler/src/bundle/windows/nsis/mod.rs
          $nsisUrl   = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip'
          $nsisSha1  = 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E'
          $utilsUrl  = 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll'
          $utilsSha1 = '75197FEE3C6A814FE035788D1C34EAD39349B860'

          $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsisPath  = Join-Path $toolsPath 'NSIS'
          $utilsRel  = 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'

          $required = @(
            'makensis.exe'
            'Bin\makensis.exe'
            'Stubs\lzma-x86-unicode'
            'Stubs\lzma_solid-x86-unicode'
            $utilsRel
            'Include\MUI2.nsh'
            'Include\FileFunc.nsh'
            'Include\x64.nsh'
            'Include\nsDialogs.nsh'
            'Include\WinMessages.nsh'
            'Include\Win\COM.nsh'
            'Include\Win\Propkey.nsh'
            'Include\Win\RestartManager.nsh'
          )

          function Test-Seed {
            if (-not (Test-Path $nsisPath)) { return $false }
            foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $nsisPath $f))) {
                Write-Host "missing $f"
                return $false
              }
            }
            (Get-FileHash (Join-Path $nsisPath $utilsRel) -Algorithm SHA1).Hash -eq $utilsSha1
          }

          function Get-WithRetry($url, $out, $sha1) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 180
                $got = (Get-FileHash $out -Algorithm SHA1).Hash
                if ($got -ne $sha1) { throw "sha1 mismatch: got $got, want $sha1" }
                return $true
              } catch {
                Write-Host "attempt $i/5 failed for $url : $($_.Exception.Message)"
                Remove-Item $out -Force -ErrorAction SilentlyContinue
                if ($i -lt 5) { Start-Sleep -Seconds ([Math]::Pow(2, $i)) }
              }
            }
            return $false
          }

          try {
            if (Test-Seed) {
              Write-Host "NSIS toolchain already present at $nsisPath"
              exit 0
            }

            Write-Host "seeding NSIS toolchain into $nsisPath"
            Remove-Item $nsisPath -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $toolsPath | Out-Null

            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
            if (-not (Get-WithRetry $nsisUrl $zip $nsisSha1)) {
              Write-Host "::warning::could not pre-seed NSIS, leaving it to the bundler"
              exit 0
            }
            Expand-Archive -Path $zip -DestinationPath $toolsPath -Force
            Move-Item (Join-Path $toolsPath 'nsis-3.13') $nsisPath -Force

            $dllDir = Join-Path $nsisPath 'Plugins\x86-unicode\additional'
            New-Item -ItemType Directory -Force -Path $dllDir | Out-Null
            if (-not (Get-WithRetry $utilsUrl (Join-Path $dllDir 'nsis_tauri_utils.dll') $utilsSha1)) {
              Write-Host "::warning::could not pre-seed nsis_tauri_utils.dll, leaving it to the bundler"
              exit 0
            }

            if (Test-Seed) {
              Write-Host "NSIS toolchain seeded - bundler will not hit the network"
            } else {
              Write-Host "::warning::seeded NSIS failed verification, leaving it to the bundler"
            }
          } catch {
            Write-Host "::warning::NSIS pre-seed errored: $($_.Exception.Message)"
            exit 0
          }

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${MAC_CERT_P12_BASE64}" || -z "${MAC_CERT_PASSWORD}" || -z "${MAC_KEYCHAIN_PASSWORD}" ]]; then
            echo "::error::Missing macOS signing secrets (MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_KEYCHAIN_PASSWORD)."
            exit 1
          fi
          CERT_PATH="${RUNNER_TEMP}/devdeck.p12"
          printf '%s' "${MAC_CERT_P12_BASE64}" | base64 -D > "${CERT_PATH}"
          security create-keychain -p "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "${CERT_PATH}" -k build.keychain -P "${MAC_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MAC_KEYCHAIN_PASSWORD}" build.keychain
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)".*/\1/p' | grep 'Developer ID Application' | head -1)"
          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::No valid Developer ID signing identity was imported."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo "Imported signing identity: ${IDENTITY}"
          rm -f "${CERT_PATH}"

      - name: Configure Apple notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_API_ISSUER}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_KEY_P8_BASE64}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Missing Apple notarization secrets (APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY_P8_BASE64, APPLE_TEAM_ID)."
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          {
            echo "APPLE_API_KEY=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "${GITHUB_ENV}"
          echo "Notarization API key configured."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: DevDeck ${{ inputs.tag || github.ref_name }}
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extra }}

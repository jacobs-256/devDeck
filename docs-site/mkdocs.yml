site_name: DevDeck
site_url: https://dtb.256th.com
repo_url: https://github.com/jacobs-256/devToolBox
repo_name: jacobs-256/devToolBox

docs_dir: ../docs
site_dir: site

exclude_docs: |
  README.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - git-revision-date-localized:
      type: date

nav:
  - Home:
      - Docs Home: index.md
  - Users:
      - User Guide: users/guide.md
      - FAQ: users/faq.md
      - Support: governance/support.md
      - Security Policy: governance/security.md
  - Plugin Developers:
      - Plugin Dev Guide: plugin-dev/guide.md
      - Marketplace Authoring (SDK 2.0): plugin-dev/marketplace-v2.md
      - SDK Reference: plugin-dev/sdk.md
      - Packaging & Signing: plugin-dev/packaging.md
  - Developers:
      - Development Guide: development.md
      - Design System: design-system.md
      - CLI: shared/cli.md
      - Troubleshooting: shared/troubleshooting.md
  - Rust + Tauri Architecture:
      - Overview: architecture/overview.md
      - Marketplace Protocol: architecture/marketplace.md
      - Security Model: architecture/security-model.md
      - Migration Record: architecture/migration.md
      - Releasing: architecture/release.md
  - 中文文档:
      - 中文索引: zh-CN/README.md
      - 用户指南: zh-CN/users/guide.md
      - 常见问题: zh-CN/users/faq.md
      - 二次开发指南: zh-CN/development.md
      - 架构总览: zh-CN/architecture/overview.md
      - Marketplace 协议: zh-CN/architecture/marketplace.md
      - 安全模型: zh-CN/architecture/security-model.md
      - 迁移状态: zh-CN/architecture/migration.md
      - 发布流程: zh-CN/architecture/release.md
      - 设计规范: zh-CN/design-system.md
      - 插件开发指南: zh-CN/plugin-dev/marketplace-v2.md
  - Governance:
      - Open Source: governance/open-source.md
      - Contributing: governance/contributing.md
      - Code of Conduct: governance/code-of-conduct.md
      - Security: governance/security.md
      - Support: governance/support.md
      - Roadmap: governance/roadmap.md
      - Changelog: governance/changelog.md
      - Notice: governance/notice.md

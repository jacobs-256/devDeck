[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/devdeck-contract",
  "crates/devdeck-capability",
  "crates/devdeck-market",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/jacobs-256/devDeck"
authors = ["DevDeck contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
zip = "2"
url = "2"
tempfile = "3"
serde_repr = "0.1"

devdeck-contract = { path = "crates/devdeck-contract" }
devdeck-capability = { path = "crates/devdeck-capability" }
devdeck-market = { path = "crates/devdeck-market" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true


# RSA key generation is CPU-bound; keep the dependency optimized in dev builds
# so "Generate" remains responsive while the UI shows a loading state.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3